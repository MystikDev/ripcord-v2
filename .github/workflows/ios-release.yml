name: Release iOS

# Triggered by tags matching `vios-*` (e.g. vios-0.1.0). Builds the Capacitor
# iOS app from apps/mobile and uploads the IPA to App Store Connect / TestFlight.
#
# Required GitHub secrets (set under Settings → Secrets and variables → Actions):
#   IOS_DIST_CERT_P12             — base64 of distribution .p12 cert
#   IOS_DIST_CERT_PASSWORD        — passphrase for the .p12
#   IOS_PROVISIONING_PROFILE      — base64 of App Store .mobileprovision
#   KEYCHAIN_PASSWORD             — any string; used as a temp keychain password
#   APP_STORE_CONNECT_API_KEY_ID  — Key ID from App Store Connect
#   APP_STORE_CONNECT_ISSUER_ID   — Issuer ID
#   APP_STORE_CONNECT_API_KEY     — base64 of the .p8 private key
#   IOS_TEAM_ID                   — Apple Developer team ID (10-char alphanumeric)

on:
  push:
    tags:
      - 'vios-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version (e.g. 0.1.0)'
        required: true
        default: '0.1.0'

jobs:
  build:
    name: Build & upload to TestFlight
    runs-on: macos-14

    env:
      BUNDLE_ID: gg.ripcord.mobile
      MOBILE_DIR: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @ripcord/types build

      - name: Build mobile web layer
        env:
          VITE_API_URL: https://api.ripcord.gg
          VITE_AUTH_URL: https://auth.ripcord.gg
          VITE_GATEWAY_URL: wss://gw.ripcord.gg
        run: pnpm --filter ripcord-mobile build

      - name: Add iOS platform if missing
        working-directory: ${{ env.MOBILE_DIR }}
        run: |
          if [ ! -d "ios" ]; then
            pnpm exec cap add ios
          fi

      - name: Sync Capacitor → iOS
        working-directory: ${{ env.MOBILE_DIR }}
        run: pnpm exec cap sync ios

      - name: Set marketing & build version
        working-directory: ${{ env.MOBILE_DIR }}/ios/App
        run: |
          MARKETING_VERSION="${{ github.event.inputs.version || github.ref_name }}"
          # Strip the 'vios-' prefix if present (e.g. vios-0.1.0 → 0.1.0)
          MARKETING_VERSION="${MARKETING_VERSION#vios-}"
          # Use the run number as the build number so it's monotonically increasing
          BUILD_NUMBER="${{ github.run_number }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $MARKETING_VERSION" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" App/Info.plist
          echo "Set marketing version: $MARKETING_VERSION (build $BUILD_NUMBER)"

      - name: Import signing certificate
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Decode certificate
          echo "$IOS_DIST_CERT_P12" | base64 --decode > /tmp/cert.p12

          # Create a temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security list-keychains -d user -s build.keychain login.keychain

          # Import the cert
          security import /tmp/cert.p12 \
            -k build.keychain \
            -P "$IOS_DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/ripcord.mobileprovision

      - name: Build & archive
        working-directory: ${{ env.MOBILE_DIR }}/ios/App
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -allowProvisioningUpdates=NO \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            archive

      - name: Export IPA
        working-directory: ${{ env.MOBILE_DIR }}/ios/App
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          # Generate exportOptions.plist for App Store distribution
          cat > $RUNNER_TEMP/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>$IOS_TEAM_ID</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>uploadSymbols</key>
              <true/>
              <key>uploadBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/exportOptions.plist

      - name: Upload IPA to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          # Save the API key where altool/notarytool expect it
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"

          IPA_PATH=$(ls $RUNNER_TEMP/export/*.ipa | head -1)
          echo "Uploading $IPA_PATH to App Store Connect..."

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Upload IPA artifact (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: ripcord-mobile-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 7
