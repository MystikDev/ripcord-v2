[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
] }
webview2-com = "0.33"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

# Internal crates
engine-core = { path = "crates/engine-core" }
engine-webview = { path = "crates/engine-webview" }
engine-window = { path = "crates/engine-window" }
engine-ipc = { path = "crates/engine-ipc" }

[package]
name = "ripcord-engine"
version.workspace = true
edition.workspace = true

[dependencies]
engine-core = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
