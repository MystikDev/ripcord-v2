<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ripcord Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a1a;
      color: #e0e0f0;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ---------- animated background ---------- */
    .bg-stars {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(1px 1px at  10%  20%, rgba(255,255,255,.5), transparent),
        radial-gradient(1px 1px at  30%  70%, rgba(255,255,255,.4), transparent),
        radial-gradient(1px 1px at  50%  10%, rgba(255,255,255,.3), transparent),
        radial-gradient(1px 1px at  70%  40%, rgba(255,255,255,.5), transparent),
        radial-gradient(1px 1px at  90%  80%, rgba(255,255,255,.4), transparent),
        radial-gradient(1.5px 1.5px at  15%  55%, rgba(0,240,255,.6), transparent),
        radial-gradient(1.5px 1.5px at  85%  25%, rgba(0,240,255,.5), transparent),
        radial-gradient(1px 1px at  45%  90%, rgba(255,255,255,.3), transparent),
        radial-gradient(1px 1px at  65%  50%, rgba(255,255,255,.4), transparent),
        radial-gradient(1px 1px at  25%  35%, rgba(255,255,255,.3), transparent);
    }

    .bg-nebula {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 600px 400px at 20% 80%, rgba(80,0,180,.12), transparent),
        radial-gradient(ellipse 500px 300px at 80% 20%, rgba(0,180,255,.08), transparent),
        radial-gradient(ellipse 800px 500px at 50% 50%, rgba(0,240,255,.04), transparent);
    }

    /* ---------- layout ---------- */
    .container {
      position: relative; z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 24px;
    }

    .header {
      text-align: center;
      margin-bottom: 48px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #00f0ff 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header .subtitle {
      margin-top: 8px;
      font-size: 13px;
      color: #6b7094;
    }

    .header .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      font-size: 12px;
      color: #6b7094;
    }

    .header .status .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e88;
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: .4; }
    }

    /* ---------- cards grid ---------- */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .card {
      background: rgba(22, 24, 48, .7);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 16px;
      padding: 28px 24px;
      backdrop-filter: blur(12px);
      transition: border-color .25s, transform .2s, box-shadow .25s;
    }

    .card:hover {
      border-color: rgba(0,240,255,.2);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,240,255,.06);
    }

    .card .label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #6b7094;
      margin-bottom: 12px;
    }

    .card .value {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .card .icon {
      float: right;
      font-size: 28px;
      opacity: .5;
      margin-top: -4px;
    }

    /* accent colors per card */
    .card.users .value    { color: #00f0ff; text-shadow: 0 0 20px rgba(0,240,255,.3); }
    .card.active .value   { color: #22c55e; text-shadow: 0 0 20px rgba(34,197,94,.3); }
    .card.solar .value    { color: #f59e0b; text-shadow: 0 0 20px rgba(245,158,11,.3); }
    .card.galaxies .value { color: #a78bfa; text-shadow: 0 0 20px rgba(167,139,250,.3); }

    /* ---------- refresh ---------- */
    .refresh-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 40px;
    }

    .refresh-btn {
      background: rgba(0,240,255,.1);
      border: 1px solid rgba(0,240,255,.2);
      color: #00f0ff;
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, border-color .2s;
    }

    .refresh-btn:hover {
      background: rgba(0,240,255,.18);
      border-color: rgba(0,240,255,.4);
    }

    .refresh-btn:active { transform: scale(.97); }

    .refresh-btn.loading {
      pointer-events: none;
      opacity: .5;
    }

    .last-updated {
      font-size: 12px;
      color: #4a4e6a;
    }

    /* count-up animation */
    @keyframes fade-in-up {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card { animation: fade-in-up .5s ease-out both; }
    .card:nth-child(2) { animation-delay: .08s; }
    .card:nth-child(3) { animation-delay: .16s; }
    .card:nth-child(4) { animation-delay: .24s; }

    /* error toast */
    .error-toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.3);
      color: #f87171; padding: 10px 20px; border-radius: 10px;
      font-size: 13px; display: none; z-index: 10;
    }
    .error-toast.show { display: block; }
  </style>
</head>
<body>
  <div class="bg-stars"></div>
  <div class="bg-nebula"></div>

  <div class="container">
    <div class="header">
      <h1>Ripcord Mission Control</h1>
      <p class="subtitle">Platform-wide metrics</p>
      <div class="status">
        <span class="dot"></span>
        <span>Production &mdash; api.ripcord.gg</span>
      </div>
    </div>

    <div class="grid">
      <div class="card users">
        <span class="icon">&#x1F465;</span>
        <div class="label">Registered Users</div>
        <div class="value" id="stat-users">--</div>
      </div>

      <div class="card active">
        <span class="icon">&#x1F7E2;</span>
        <div class="label">Active Now</div>
        <div class="value" id="stat-active">--</div>
      </div>

      <div class="card solar">
        <span class="icon">&#x2600;&#xFE0F;</span>
        <div class="label">Solar Systems</div>
        <div class="value" id="stat-solar">--</div>
      </div>

      <div class="card galaxies">
        <span class="icon">&#x1F30C;</span>
        <div class="label">Galaxies</div>
        <div class="value" id="stat-galaxies">--</div>
      </div>
    </div>

    <div class="refresh-bar">
      <button class="refresh-btn" id="refresh-btn" onclick="refreshStats()">Refresh</button>
      <span class="last-updated" id="last-updated"></span>
    </div>
  </div>

  <div class="error-toast" id="error-toast"></div>

  <script>
    // -----------------------------------------------------------------------
    // Config — edit these if your setup changes
    // -----------------------------------------------------------------------
    const API_BASE = 'https://api.ripcord.gg';

    // Paste a valid JWT access token here to enable live refresh.
    // You can grab one from the app's localStorage or dev-tools network tab.
    const AUTH_TOKEN = '';

    // -----------------------------------------------------------------------
    // State
    // -----------------------------------------------------------------------
    let stats = {
      users: 19,
      active: 1,
      solar: 14,
      galaxies: 0,
    };

    // -----------------------------------------------------------------------
    // Count-up animation
    // -----------------------------------------------------------------------
    function animateValue(el, target) {
      const duration = 600;
      const start = parseInt(el.textContent) || 0;
      if (start === target) { el.textContent = target.toLocaleString(); return; }
      const range = target - start;
      const startTime = performance.now();
      function step(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const ease = 1 - Math.pow(1 - progress, 3); // ease-out cubic
        el.textContent = Math.round(start + range * ease).toLocaleString();
        if (progress < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    function render() {
      animateValue(document.getElementById('stat-users'), stats.users);
      animateValue(document.getElementById('stat-active'), stats.active);
      animateValue(document.getElementById('stat-solar'), stats.solar);
      animateValue(document.getElementById('stat-galaxies'), stats.galaxies);
      document.getElementById('last-updated').textContent =
        'Updated ' + new Date().toLocaleTimeString();
    }

    // -----------------------------------------------------------------------
    // Live refresh (requires AUTH_TOKEN)
    // -----------------------------------------------------------------------
    async function refreshStats() {
      if (!AUTH_TOKEN) {
        showError('Set AUTH_TOKEN in dashboard.html to enable live refresh');
        return;
      }

      const btn = document.getElementById('refresh-btn');
      btn.classList.add('loading');
      btn.textContent = 'Refreshing\u2026';

      try {
        const headers = { Authorization: 'Bearer ' + AUTH_TOKEN };

        const [usersRes, hubsRes] = await Promise.all([
          fetch(API_BASE + '/v1/users/stats', { headers }).then(r => r.json()),
          // No dedicated hub count endpoint — we'll use the users/stats for now
          // and keep solar systems from the last known value
          Promise.resolve(null),
        ]);

        if (usersRes.ok && usersRes.data) {
          stats.users = usersRes.data.totalUsers;
        }

        render();
      } catch (err) {
        showError('Refresh failed: ' + err.message);
      } finally {
        btn.classList.remove('loading');
        btn.textContent = 'Refresh';
      }
    }

    function showError(msg) {
      const el = document.getElementById('error-toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 4000);
    }

    // -----------------------------------------------------------------------
    // Init
    // -----------------------------------------------------------------------
    render();
  </script>
</body>
</html>
